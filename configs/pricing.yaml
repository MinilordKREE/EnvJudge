# Versioned list prices, USD per 1M tokens. Bump a model's pricing_version whenever any of its numbers
# change; ledger rows record the version they were priced with together with the raw token counts.
currency: USD
unit: per_1m_tokens
models:
  # Qwen3-8B via OpenRouter, sole endpoint Alibaba; verified against usage.cost in the E1-pilot ledger
  # (docs/pilots/e1pilot/LOG.md, 2026-09-07).
  qwen/qwen3-8b:
    pricing_version: "openrouter-qwen3-8b-2026-09-07"
    as_of: 2026-09-07
    source: https://openrouter.ai/api/v1/models/qwen/qwen3-8b/endpoints
    flat: {input_cache_hit: 0.117, input_cache_miss: 0.117, output: 0.455}
  # Gemini 3.1 Flash-Lite via OpenRouter, Google AI Studio standard tier (endpoint list, 2026-09-07); verified against
  # usage.cost on 5 probe calls incl. implicit-cache hits (cached_tokens reported; no cache-write charge), 2026-09-07.
  google/gemini-3.1-flash-lite:
    pricing_version: "openrouter-gemini-3.1-flash-lite-2026-09-07"
    as_of: 2026-09-07
    source: https://openrouter.ai/api/v1/models/google/gemini-3.1-flash-lite/endpoints
    flat: {input_cache_hit: 0.025, input_cache_miss: 0.25, output: 1.50}
