  # 2026-09-07): USD 0.15 per M input tokens, no output.
  google/gemini-embedding-001:
    pricing_version: "openrouter-gemini-embedding-001-2026-09-07"
    as_of: 2026-09-07
    source: https://openrouter.ai/api/v1/models/google/gemini-embedding-001/endpoints
    flat: {input_cache_hit: 0.15, input_cache_miss: 0.15, output: 0.0}
