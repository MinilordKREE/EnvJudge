env:
  import_path: envharness.bridges.alfworld:AlfworldEnv
  reset_options:
    split: train
    repetition_threshold: 0
agent:
  type: llm
  client_factory: aea.llm.envharness_client:AeaLLMClient
  client_kwargs:
    llm:
      provider: openrouter
      model: google/gemini-3.1-flash-lite
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      provider_pin: google-ai-studio
      temperature: 0.7
      max_tokens: 4096
      thinking: null
      reasoning_effort: null
      timeout_s: 120.0
      cost_tolerance: 1.0e-06
      retry:
        max_attempts: 5
        initial_delay_s: 1.0
        max_delay_s: 30.0
        multiplier: 2.0
        jitter_s: 1.0
        total_timeout_s: 300.0
        retry_status_codes:
        - 408
        - 409
        - 425
        - 429
    budget: designer
    phase: designer
    ledger_dir: /home/kree/work/EnvJudge/runs/r1-Gplus
    pricing_path: /home/kree/work/EnvJudge/configs/pricing.yaml
  extra_instructions: "Reference perturbation families (illustrative code from a different\
    \ method; adapt freely or ignore; there is no dose requirement here):\n--- footer_mask\
    \ ---\nimport hashlib\n\n\nclass _Rules(Rules):\n    \"\"\"FooterMask (O axis,\
    \ harder with DOSE): hide the admissible-commands footer at a\n    deterministic\
    \ fraction DOSE of the steps. bucket = sha256(f\"{task_id}:{step}\")[:8] % 10000;\n\
    \    masked iff bucket < DOSE * 10000, so the masked step set is nested in DOSE.\
    \ Solvable by\n    construction (the world is untouched).\"\"\"\n\n    DOSE =\
    \ __DOSE__\n    TASK_ID = __TASK_ID__\n\n    def _masked(self, env_state):\n \
    \       step = int(getattr(env_state, \"step_count\", 0) or 0)\n        digest\
    \ = hashlib.sha256(f\"{self.TASK_ID}:{step}\".encode(\"utf-8\")).hexdigest()\n\
    \        return (int(digest[:8], 16) % 10000) < int(self.DOSE * 10000)\n\n   \
    \ def filter_observation(self, obs, env_state):\n        if not self._masked(env_state):\n\
    \            return obs\n        text = obs.text\n        cut = text.find(\"\\\
    n\\nAdmissible commands: \")\n        if cut >= 0:\n            text = text[:cut]\n\
    \        data = dict(obs.data or {})\n        data.pop(\"admissible_commands\"\
    , None)\n        return Observation(text=text, data=data)\n\n--- horizon_squeeze\
    \ ---\nclass _Rules(Rules):\n    \"\"\"HorizonSqueeze (T axis, harder with DOSE):\
    \ the episode is truncated (not terminated) once\n    step_count >= M without\
    \ success. M = the (1 - DOSE) quantile of the policy's successful\n    episode\
    \ lengths, so M >= the shortest success: solvable by construction. A step that\
    \ completes\n    the task at exactly step M is returned unchanged (success is\
    \ checked first).\"\"\"\n\n    DOSE = __DOSE__\n    M = __M__\n\n    def modify_transition(self,\
    \ action, raw_response, env_state):\n        if raw_response.info.get(\"success\"\
    ) is True or bool(getattr(env_state, \"won\", False)):\n            return raw_response\n\
    \        if raw_response.terminated or raw_response.truncated:\n            return\
    \ raw_response\n        if int(getattr(env_state, \"step_count\", 0) or 0) >=\
    \ self.M:\n            return EnvResponse(\n                observation=raw_response.observation,\n\
    \                reward=raw_response.reward,\n                terminated=False,\n\
    \                truncated=True,\n                info={**raw_response.info, \"\
    horizon_squeeze\": self.M},\n            )\n        return raw_response\n\n---\
    \ displacement ---\nDisplacement (S0 axis, harder with DOSE; DOSE in {1/3, 2/3,\
    \ 1} maps to k in {1, 2, 3}): the target\nobjects the expert picks up are moved\
    \ before the policy starts. k=1: each target to a different open\nreceptacle (not\
    \ its source, never the goal receptacle class); k=2: each target inside a closable\n\
    container (go to C, open C, move, close C); k=3: k=2 plus every other closable\
    \ container closed. The\naction list is validated step by step (admissible before\
    \ issue, effective after) and ends with\n`look`; it is a Setup action list (`in_env_actions`),\
    \ not rules code. Certified by the expert x3\nfrom the staged state.\n"
policy:
  client_factory: aea.llm.envharness_client:AeaLLMClient
  client_kwargs:
    llm:
      provider: openrouter
      model: google/gemini-3.1-flash-lite
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      provider_pin: google-ai-studio
      temperature: 0.5
      max_tokens: 2048
      thinking: null
      reasoning_effort: null
      timeout_s: 120.0
      cost_tolerance: 1.0e-06
      retry:
        max_attempts: 5
        initial_delay_s: 1.0
        max_delay_s: 30.0
        multiplier: 2.0
        jitter_s: 1.0
        total_timeout_s: 300.0
        retry_status_codes:
        - 408
        - 409
        - 425
        - 429
    ledger_dir: /home/kree/work/EnvJudge/runs/r1-Gplus
    pricing_path: /home/kree/work/EnvJudge/configs/pricing.yaml
  action_format: think_action
  max_history: 200
  temperature: 0.5
  task_description: 'You are an agent in a text-based household environment (ALFWorld).

    Each turn you receive an observation and a list of admissible

    commands. First reason step-by-step about the current situation

    inside <think>...</think> tags. Then pick ONE admissible command

    and output it inside <action>...</action> tags.

    '
objective:
  type: difficulty_zone
  target_band:
  - 0.4
  - 0.6
  window: 20
budget:
  type: capped_adaptive
  max_k: 5
orchestrator:
  task_id: alfworld-corpus-ours-release
  task_description: 'Mutate train tasks where the Policy is currently weak; only emit

    harnesses that exercise failure-recovery skills WITHOUT shifting

    the env''s surface presentation.

    '
  n_iterations: 100
  max_episode_steps: 50
  k_per_candidate: 5
  rollout_concurrency: 5
  base_seed: 0
  baseline_cache_dir: null
  task_id_stride: 1
  task_id_base_offset: 0
  discard_rollout_steps_after_decide: false
  mutator_baseline_mode: full
  skip_passthrough_candidates: true
runner:
  type: subprocess
  timeout_seconds: 500
storage:
  trace_path: /home/kree/work/EnvJudge/runs/r1-Gplus/traces.jsonl
logging:
  log_dir: /home/kree/work/EnvJudge/runs/r1-Gplus
  log_policy_calls: true
  log_agent_calls: true
