name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync locked environment (no ALFWorld extra)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Unit tests (offline; integration tests deselected)
        run: uv run pytest
        env:
          OPENROUTER_API_KEY: ci-not-a-real-key
          DEEPSEEK_API_KEY: ci-not-a-real-key
